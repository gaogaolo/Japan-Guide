name: Update Fuji weather

on:
  schedule:
    # 23:30 UTC = 07:30 China time / 08:30 Japan time the following morning.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and assess Fuji forecast
        run: node scripts/update-fuji-weather.mjs
      - name: Commit refreshed forecast when changed
        run: |
          if git diff --quiet -- data/fuji-status.json; then
            echo "No forecast change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuji-status.json
          git commit -m "Update Fuji weather forecast"
          git push
